<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile=matchMedia('(max-width: 700px)').matches;
const COUNT=reduced?1800:(mobile?4200:7200);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),reduced?.45:1.05,.45,.08);
composer.addPass(bloom);

camera.position.set(0,0,105);
const geo=new THREE.TetrahedronGeometry(.18,0);
const mat=new THREE.MeshBasicMaterial({vertexColors:true});
const mesh=new THREE.InstancedMesh(geo,mat,COUNT);
scene.add(mesh);
const dummy=new THREE.Object3D();
const color=new THREE.Color();
const positions=new Float32Array(COUNT*3);
const target=new THREE.Vector3();

for(let i=0;i<COUNT;i++){
  positions[i*3]=(Math.random()-.5)*120;
  positions[i*3+1]=(Math.random()-.5)*80;
  positions[i*3+2]=(Math.random()-.5)*100;
}

function frame(){
  requestAnimationFrame(frame);
  const t=performance.now()*.00035;
  for(let i=0;i<COUNT;i++){
    const n=i/COUNT;
    const theta=6.283185*i/1.618034;
    const phi=Math.acos(1-2*n);
    const p=(n+t*.028)%1;
    const e=Math.pow(p,1.55);
    const radius=9+100*(1-e);
    const spread=Math.pow(1-p,2);
    target.set(
      radius*Math.sin(phi)*Math.cos(theta)+Math.sin(t*1.8+n*90)*13*spread,
      radius*Math.sin(phi)*Math.sin(theta)+Math.cos(t*1.45+n*150)*13*spread,
      radius*Math.cos(phi)+Math.sin(t*2.1-n*210)*10*spread
    );
    const k=0.055;
    positions[i*3]+= (target.x-positions[i*3])*k;
    positions[i*3+1]+= (target.y-positions[i*3+1])*k;
    positions[i*3+2]+= (target.z-positions[i*3+2])*k;
    dummy.position.set(positions[i*3],positions[i*3+1],positions[i*3+2]);
    dummy.rotation.set(t*.12+n*7,t*.18+n*5,t*.1);
    dummy.scale.setScalar(.55+.65*p);
    dummy.updateMatrix();
    mesh.setMatrixAt(i,dummy.matrix);
    color.setHSL(.73-.16*p,.72,.34+.42*p);
    mesh.setColorAt(i,color);
  }
  mesh.instanceMatrix.needsUpdate=true;
  mesh.instanceColor.needsUpdate=true;
  composer.render();
}
frame();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
