<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body><script type="module">import * as THREE from 'three';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const COUNT=12000,scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,2000);camera.position.set(0,0,110);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.25,.55,.05);composer.addPass(bloom);const geo=new THREE.TetrahedronGeometry(.24),mat=new THREE.MeshBasicMaterial({color:0xffffff}),mesh=new THREE.InstancedMesh(geo,mat,COUNT);mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(mesh);const dummy=new THREE.Object3D(),c=new THREE.Color(),pos=Array.from({length:COUNT},()=>new THREE.Vector3((Math.random()-.5)*130,(Math.random()-.5)*100,(Math.random()-.5)*120));const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime()*.7;for(let i=0;i<COUNT;i++){const n=i/COUNT,theta=6.283185*i/1.618034,phi=Math.acos(1-2*n),p=(n+t*.035)%1,e=Math.pow(p,1.55),r=12+118*(1-e),inst=Math.pow(1-p,2),x=r*Math.sin(phi)*Math.cos(theta)+Math.sin(t*1.7+n*90)*17*inst,y=r*Math.sin(phi)*Math.sin(theta)+Math.cos(t*1.35+n*150)*17*inst,z=r*Math.cos(phi)+Math.sin(t*2.2-n*210)*13*inst;const tx=x,ty=y,tz=z;pos[i].lerp(new THREE.Vector3(tx,ty,tz),.075);dummy.position.copy(pos[i]);dummy.rotation.set(t*.15+n*8,t*.2+n*5,t*.1);dummy.scale.setScalar(.65+.65*p);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);const hue=.72-.18*p;c.setHSL(hue,.82,.28+.55*p);mesh.setColorAt(i,c)}mesh.instanceMatrix.needsUpdate;mesh.instanceColor.needsUpdate;composer.render();}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});</script></body></html>
