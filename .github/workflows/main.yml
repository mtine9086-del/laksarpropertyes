name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compute base path
        id: vars
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "base_path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          BASE_PATH: ${{ steps.vars.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io${{ steps.vars.outputs.base_path }}
        run: npm run build
      - name: Copy supplied property visuals
        run: |
          cp hero-poster.jpg out/hero-poster.jpg
          cp cat-plots.jpg out/cat-plots.jpg
          cp cat-land.jpg out/cat-land.jpg
          cp cat-houses.jpg out/cat-houses.jpg
          cp cat-commercial.jpg out/cat-commercial.jpg
          cp prop-land-khanpur.jpg out/prop-land-khanpur.jpg
          cp prop-plot-nh334.jpg out/prop-plot-nh334.jpg
          cp prop-house-3bhk.jpg out/prop-house-3bhk.jpg
          cp prop-plot-colony.jpg out/prop-plot-colony.jpg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
